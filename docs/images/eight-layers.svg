<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Eight corners, eight musical entrances</title><desc id="desc">Kick begins at cycle zero, then bass, snare, hats, percussion, chords, melody and texture enter every two cycles. All eight continue repeating after cycle fourteen.</desc><rect width="1200" height="440" rx="18" fill="#090b0d"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="40" y="44" fill="#90999e" font-size="13" letter-spacing="2">8 CORNERS / A NEW LAYER EVERY 2 CYCLES</text><line x1="210" y1="84" x2="210" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="210" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">0</text><line x1="316" y1="84" x2="316" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="316" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">2</text><line x1="422" y1="84" x2="422" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="422" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">4</text><line x1="528" y1="84" x2="528" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="528" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">6</text><line x1="634" y1="84" x2="634" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="634" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">8</text><line x1="740" y1="84" x2="740" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="740" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">10</text><line x1="846" y1="84" x2="846" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="846" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">12</text><line x1="952" y1="84" x2="952" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="952" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">14</text><line x1="1058" y1="84" x2="1058" y2="372" stroke="#30363b" stroke-dasharray="2 6"/><text x="1058" y="77" text-anchor="middle" fill="#a7b0b5" font-size="12">16</text><text x="40" y="110" fill="#dfe5e8" font-size="13">d1 / kick</text><rect x="210" y="96" width="890" height="18" rx="3" fill="#6ce8da" opacity=".7"/><circle cx="210" cy="105" r="4" fill="#fff"/><text x="40" y="145" fill="#dfe5e8" font-size="13">d2 / bass</text><rect x="316" y="131" width="784" height="18" rx="3" fill="#76dfdd" opacity=".7"/><circle cx="316" cy="140" r="4" fill="#fff"/><text x="40" y="180" fill="#dfe5e8" font-size="13">d3 / snare</text><rect x="422" y="166" width="678" height="18" rx="3" fill="#83cddb" opacity=".7"/><circle cx="422" cy="175" r="4" fill="#fff"/><text x="40" y="215" fill="#dfe5e8" font-size="13">d4 / hats</text><rect x="528" y="201" width="572" height="18" rx="3" fill="#9ab9dd" opacity=".7"/><circle cx="528" cy="210" r="4" fill="#fff"/><text x="40" y="250" fill="#dfe5e8" font-size="13">d5 / percussion</text><rect x="634" y="236" width="466" height="18" rx="3" fill="#b3a7df" opacity=".7"/><circle cx="634" cy="245" r="4" fill="#fff"/><text x="40" y="285" fill="#dfe5e8" font-size="13">d6 / chords</text><rect x="740" y="271" width="360" height="18" rx="3" fill="#c996da" opacity=".7"/><circle cx="740" cy="280" r="4" fill="#fff"/><text x="40" y="320" fill="#dfe5e8" font-size="13">d7 / melody</text><rect x="846" y="306" width="254" height="18" rx="3" fill="#dea3bc" opacity=".7"/><circle cx="846" cy="315" r="4" fill="#fff"/><text x="40" y="355" fill="#dfe5e8" font-size="13">d8 / texture</text><rect x="952" y="341" width="148" height="18" rx="3" fill="#e9bf85" opacity=".7"/><circle cx="952" cy="350" r="4" fill="#fff"/><text x="40" y="409" fill="#90999e" font-size="12">1 cycle = 4 beats · each phrase = 2 cycles</text><text x="1095" y="409" text-anchor="end" fill="#dfe5e8" font-size="12">cycle 14 → all layers repeat</text></g></svg>